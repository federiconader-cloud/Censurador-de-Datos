<!doctype html>
<html lang="es" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Censor Tool - V10</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="/_sdk/element_sdk.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    * { font-family: 'DM Sans', sans-serif; }
    .tool-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; }
    .checkbox-custom:checked + div { border-color: #6c5ce7; background-color: #6c5ce7; }
    .checkbox-custom:checked + div i { opacity: 1; }
    body { box-sizing: border-box; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #3a3a4a; border-radius: 10px; }
    .img-active { border-color: #6c5ce7 !important; box-shadow: 0 0 12px rgba(108, 92, 231, 0.4); transform: scale(1.05); }
  </style>
 </head>
 <body class="h-full w-full bg-[#0f0f12] text-white overflow-hidden flex flex-col">
  <div id="app" class="h-full w-full flex flex-col">
   
   <header class="flex items-center justify-between px-5 py-3 bg-[#1a1a24] border-b border-[#2a2a3a] shrink-0">
    <h1 id="app-title" class="text-lg font-bold text-[#e0e0ff]">Censurar Imágenes</h1>
    <div class="flex gap-2">
     <button id="btn-clear" onclick="clearCanvas()" class="px-3 py-1.5 rounded-lg bg-[#2a2a3a] hover:bg-[#3a3a4a] text-sm flex items-center gap-1.5 transition-colors"> 
        <i data-lucide="eraser" style="width:15px;height:15px"></i> Limpiar 
     </button> 
     <button id="btn-undo" onclick="undo()" class="px-3 py-1.5 rounded-lg bg-[#2a2a3a] hover:bg-[#3a3a4a] text-sm flex items-center gap-1.5 transition-colors"> 
        <i data-lucide="undo-2" style="width:15px;height:15px"></i> Deshacer 
     </button> 
     <button id="btn-download" onclick="downloadMainImage()" class="px-3 py-1.5 rounded-lg bg-[#6c5ce7] hover:bg-[#5a4bd6] text-sm font-medium flex items-center gap-1.5 transition-colors"> 
        <i data-lucide="download" style="width:15px;height:15px"></i> Descargar Actual 
     </button>
    </div>
   </header>
   
   <div class="flex items-center gap-3 px-5 py-2.5 bg-[#16161f] border-b border-[#2a2a3a] shrink-0 flex-wrap z-10">
    <span class="text-xs text-[#888] uppercase tracking-wider mr-1">Forma del Pincel:</span> 
    <div class="flex gap-1.5">
        <button class="tool-btn active px-3 py-1.5 rounded-lg bg-[#2a2a3a] text-sm transition-colors border border-transparent flex items-center gap-2" data-shape="circle" onclick="setBrushShape('circle')"> 
            <i data-lucide="circle" style="width:14px;height:14px"></i> Círculo 
        </button> 
        <button class="tool-btn px-3 py-1.5 rounded-lg bg-[#2a2a3a] text-sm transition-colors border border-transparent flex items-center gap-2" data-shape="square" onclick="setBrushShape('square')"> 
            <i data-lucide="square" style="width:14px;height:14px"></i> Cuadrado 
        </button>
    </div>
    
    <div class="h-5 w-px bg-[#2a2a3a] mx-2"></div>
    
    <span class="text-xs text-[#888]">Tamaño:</span> 
    <input type="range" id="brush-size" min="10" max="150" value="40" class="w-24 accent-[#6c5ce7]" oninput="updateBrushSize(this.value)"> 
    <span id="size-label" class="text-xs text-[#aaa] w-8">40</span>
    
    <div class="ml-4 flex items-center gap-2 pl-4 border-l border-[#2a2a3a]">
     <span class="text-xs text-[#888]">Nivel:</span> 
     <select id="blur-level" class="px-2 py-1 rounded bg-[#2a2a3a] text-sm text-white border border-[#3a3a4a]" onchange="blurLevel=this.value"> 
      <option value="low" selected>Bajo</option> 
      <option value="high">Alto</option> 
     </select>
    </div>
   </div>
   
   <div class="flex-1 flex overflow-hidden relative">
       
       <div class="flex-1 flex items-center justify-center p-4 overflow-hidden relative bg-[#0f0f12]" id="canvas-wrapper">
        <div id="upload-area" class="flex items-center justify-center w-full max-w-xl h-80 border-2 border-dashed border-[#3a3a4a] rounded-3xl cursor-pointer hover:border-[#6c5ce7] hover:bg-[#1a1a24] transition-all group" onclick="document.getElementById('file-input').click()" ondragover="event.preventDefault();this.classList.add('border-[#6c5ce7]')" ondragleave="this.classList.remove('border-[#6c5ce7]')" ondrop="handleDrop(event)">
          <div class="flex flex-col items-center gap-4 text-center">
              <div class="w-16 h-16 rounded-full bg-[#6c5ce7]/20 flex items-center justify-center group-hover:scale-110 transition-transform">
               <i data-lucide="upload-cloud" style="width:32px;height:32px;color:#6c5ce7"></i>
              </div>
              <p class="text-[#e0e0ff] text-lg font-semibold px-8">Importar Imágenes</p>
          </div>
          <input type="file" id="file-input" accept="image/*" multiple class="hidden" onchange="loadMultipleImages(this.files)">
        </div>
        
        <div id="canvas-container" class="relative hidden w-full h-full flex items-center justify-center">
         <canvas id="main-canvas" class="rounded-lg shadow-2xl" style="max-width:100%;max-height:100%;display:block; object-fit: contain;" onmousedown="startDraw(event)" onmousemove="draw(event)" onmouseup="stopDraw()" onmouseleave="stopDraw()" ontouchstart="startDrawTouch(event)" ontouchmove="drawTouch(event)" ontouchend="stopDraw()"></canvas>
         <canvas id="preview-canvas" class="absolute pointer-events-none rounded-lg" style="display:none;"></canvas>
        </div>
       </div>

       <div id="library-sidebar" class="w-28 bg-[#16161f] border-l border-[#2a2a3a] flex flex-col items-center py-4 gap-3 overflow-y-auto custom-scrollbar shrink-0 z-10 shadow-xl">
           <div class="text-[10px] text-[#888] uppercase tracking-wider font-semibold mb-1 text-center px-1">Biblioteca (<span id="lib-count">0</span>)</div>
           <div class="flex flex-col gap-2 w-full px-2">
               <button onclick="document.getElementById('file-input').click()" class="w-full h-8 rounded-lg bg-[#2a2a3a] hover:bg-[#3a3a4a] text-[10px] font-bold flex items-center justify-center gap-1 transition-colors text-[#e0e0ff] border border-[#3a3a4a]">
                   <i data-lucide="plus" style="width:12px;height:12px"></i> Añadir
               </button>
               <button onclick="deleteAllLibrary()" class="w-full h-8 rounded-lg bg-red-900/10 hover:bg-red-900/30 text-[10px] font-bold flex items-center justify-center gap-1 transition-colors text-red-400 border border-red-900/20">
                   <i data-lucide="trash" style="width:12px;height:12px"></i> Limpiar
               </button>
           </div>
           <div id="library-grid" class="flex flex-col gap-3 w-full items-center mt-2 px-2"></div>
       </div>

   </div>
   
   <div id="action-buttons" class="hidden px-5 py-3 bg-[#16161f] border-t border-[#2a2a3a] shrink-0 flex justify-end gap-2 z-10">
    <button onclick="closeCanvas()" class="px-4 py-2 rounded-lg bg-[#2a2a3a] hover:bg-[#3a3a4a] text-sm font-medium transition-colors"> Cerrar </button> 
    <button id="btn-ok" onclick="saveToGallery()" class="px-4 py-2 rounded-lg bg-[#6c5ce7] hover:bg-[#5a4bd6] text-sm font-medium transition-colors"> ✓ Guardar en Galería </button>
   </div>
   
   <div id="gallery-section" class="border-t border-[#2a2a3a] bg-[#16161f] shrink-0 p-4 hidden z-10 relative">
    <div class="flex items-center justify-between mb-3">
     <div class="text-xs text-[#888] uppercase tracking-wider font-semibold">
      Guardadas (<span id="image-count">0</span>) <span id="selection-sub-text" class="ml-2 lowercase text-[#666] font-normal italic"></span>
     </div>
     <div class="flex gap-2">
      <button onclick="downloadSelectedAsZip()" class="px-3 py-1.5 bg-[#2a2a3a] hover:bg-[#3a3a4a] text-xs font-medium rounded-lg flex gap-1.5 items-center">
        <i data-lucide="archive" class="w-3.5 h-3.5"></i> Descargar Seleccionadas
      </button>
      <button onclick="downloadAllAsZip()" class="px-3 py-1.5 bg-[#2a2a3a] hover:bg-[#3a3a4a] text-xs font-medium rounded-lg flex gap-1.5 items-center">
        <i data-lucide="download-cloud" class="w-3.5 h-3.5"></i> Descargar Todo
      </button>
      <div class="w-px h-6 bg-[#3a3a4a] mx-1"></div>
      <button onclick="deleteAllSaved()" class="px-3 py-1.5 bg-red-900/20 text-red-400 hover:bg-red-900/50 text-xs font-medium rounded-lg flex gap-1.5 items-center">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Vaciar Galería
      </button>
     </div>
    </div>
    <div id="gallery-preview" class="flex gap-3 overflow-x-auto pb-2 custom-scrollbar"></div>
   </div>
   
   <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-[#6c5ce7] text-white px-5 py-2.5 rounded-xl text-sm font-medium shadow-lg transition-all duration-300 opacity-0 pointer-events-none z-50">Guardado</div>
  </div>

  <script>
    // State
    let brushSize = 40, brushShape = 'circle', blurLevel = 'low';
    let drawing = false, shiftKey = false, lastX = 0, lastY = 0, strokeStartX = 0, strokeStartY = 0, axisLocked = null;
    let originalImg = null, history = [], activeImageId = null;
    
    let libraryImages = [], savedImages = [], selectedImages = new Set();
    
    const canvas = document.getElementById('main-canvas'), previewCanvas = document.getElementById('preview-canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true }), previewCtx = previewCanvas.getContext('2d');
    const blurCanvases = { low: document.createElement('canvas'), high: document.createElement('canvas') };

    // Persistent storage
    try {
      const stored = localStorage.getItem('censored_images');
      if (stored) { savedImages = JSON.parse(stored); updateGallery(); }
    } catch(e) {}

    // Keyboard and resize events
    document.addEventListener('keydown', (e) => { 
        if (e.key === 'Shift') shiftKey = true; 
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); undo(); }
    });
    document.addEventListener('keyup', (e) => { if (e.key === 'Shift') shiftKey = false; });
    window.addEventListener('resize', () => { if(originalImg) updateCursor(); });

    function updateBrushSize(val) { document.getElementById('size-label').textContent = val; brushSize = +val; updateCursor(); }
    
    function setBrushShape(shape) {
        brushShape = shape;
        document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b.dataset.shape === shape));
        updateCursor();
    }

    function updateCursor() {
      if (!originalImg) return;
      const v = brushSize; 
      let svg = (brushShape === 'circle') ? 
          `<svg xmlns="http://www.w3.org/2000/svg" width="${v}" height="${v}" viewBox="0 0 ${v} ${v}"><circle cx="${v/2}" cy="${v/2}" r="${Math.max(0.1, v/2 - 1)}" fill="none" stroke="black" stroke-width="1.5" /><circle cx="${v/2}" cy="${v/2}" r="${Math.max(0.1, v/2 - 2.5)}" fill="none" stroke="white" stroke-width="1" /></svg>` :
          `<svg xmlns="http://www.w3.org/2000/svg" width="${v}" height="${v}" viewBox="0 0 ${v} ${v}"><rect x="1" y="1" width="${Math.max(0.1, v - 2)}" height="${Math.max(0.1, v - 2)}" fill="none" stroke="black" stroke-width="1.5" /><rect x="2.5" y="2.5" width="${Math.max(0.1, v - 5)}" height="${Math.max(0.1, v - 5)}" fill="none" stroke="white" stroke-width="1" /></svg>`;
      canvas.style.cursor = `url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}") ${Math.round(v/2)} ${Math.round(v/2)}, crosshair`;
    }

    function handleDrop(e) { e.preventDefault(); loadMultipleImages(e.dataTransfer.files); }

    function loadMultipleImages(files) {
      if(!files.length) return;
      let loaded = 0, firstImg = null;
      Array.from(files).forEach(file => {
        if(!file.type.startsWith('image/')) return;
        const reader = new FileReader();
        reader.onload = (e) => {
          const newImg = { id: 'lib-' + Date.now() + Math.random().toString(36).substr(2, 3), data: e.target.result };
          libraryImages.push(newImg);
          if (!originalImg && !firstImg) firstImg = newImg;
          loaded++;
          if(loaded === Array.from(files).filter(f => f.type.startsWith('image/')).length) {
              renderLibrary();
              if (firstImg) openFromLibrary(firstImg.id);
          }
        };
        reader.readAsDataURL(file);
      });
    }

    function renderLibrary() {
      const grid = document.getElementById('library-grid');
      document.getElementById('lib-count').textContent = libraryImages.length;
      grid.innerHTML = '';
      libraryImages.forEach(img => {
          const isActive = img.id === activeImageId;
          const div = document.createElement('div');
          div.className = `w-20 h-20 shrink-0 cursor-pointer group relative transition-all duration-200`;
          div.innerHTML = `
              <img src="${img.data}" class="w-full h-full object-cover rounded-lg border-2 ${isActive ? 'img-active' : 'border-[#3a3a4a] group-hover:border-[#6c5ce7]'}" onclick="openFromLibrary('${img.id}')">
              <button onclick="removeFromLibrary('${img.id}', event)" class="absolute top-1 right-1 bg-red-600 rounded p-1 opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="x" class="w-3 h-3 text-white"></i></button>`;
          grid.appendChild(div);
      });
      lucide.createIcons();
    }

    function openFromLibrary(id) {
        activeImageId = id;
        const item = libraryImages.find(i => i.id === id);
        if(!item) return;
        const img = new Image();
        img.onload = () => { setupCanvasWithImage(img); renderLibrary(); updateGallery(); };
        img.src = item.data;
    }

    function removeFromLibrary(id, event) {
        event.stopPropagation();
        libraryImages = libraryImages.filter(i => i.id !== id);
        if(activeImageId === id) { activeImageId = null; closeCanvas(); }
        renderLibrary();
    }

    function deleteAllLibrary() { libraryImages = []; activeImageId = null; closeCanvas(); renderLibrary(); }

    function editSavedImage(id) {
      activeImageId = id;
      const imgObj = savedImages.find(i => i.__backendId === id);
      if (!imgObj) return;
      const img = new Image();
      img.onload = () => { setupCanvasWithImage(img); updateGallery(); renderLibrary(); };
      img.src = imgObj.image_data;
    }

   function setupCanvasWithImage(img) {
      originalImg = img;
      
      // 1. Mantenemos la resolución original de la imagen
      canvas.width = img.width; 
      canvas.height = img.height;
      
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      history = [ctx.getImageData(0, 0, canvas.width, canvas.height)];
      
      // 2. Escalamos el efecto blur en proporción a la resolución.
      // Si la imagen es 4K, un blur de 10px casi no se notará. Lo escalamos en base a un ancho de referencia.
      let scale = Math.max(1, canvas.width / 1000); 
      const blurs = { low: 10 * scale, high: 45 * scale };
      
      ['low', 'high'].forEach(level => {
          blurCanvases[level].width = canvas.width; blurCanvases[level].height = canvas.height;
          const bctx = blurCanvases[level].getContext('2d');
          bctx.filter = `blur(${blurs[level]}px)`; 
          bctx.drawImage(canvas, 0, 0);
      });
      
      document.getElementById('upload-area').classList.add('hidden');
      document.getElementById('canvas-container').classList.remove('hidden');
      document.getElementById('action-buttons').classList.remove('hidden');
      updateCursor();
    }

    function clearCanvas() { if(!originalImg) return; ctx.drawImage(originalImg, 0, 0, canvas.width, canvas.height); history = [ctx.getImageData(0, 0, canvas.width, canvas.height)]; showToast('Lienzo limpio'); }

    function getPos(e) {
      const r = canvas.getBoundingClientRect(), cX = e.touches ? e.touches[0].clientX : e.clientX, cY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: (cX - r.left) * (canvas.width / r.width), y: (cY - r.top) * (canvas.height / r.height) };
    }

    function startDraw(e) {
      drawing = true; const p = getPos(e); lastX = p.x; lastY = p.y; strokeStartX = p.x; strokeStartY = p.y;
      const s = brushSize * (canvas.width / canvas.getBoundingClientRect().width);
      ctx.save(); ctx.beginPath();
      if (brushShape === 'circle') ctx.arc(lastX, lastY, s / 2, 0, Math.PI * 2); else ctx.rect(lastX - s / 2, lastY - s / 2, s, s);
      ctx.clip(); ctx.drawImage(blurCanvases[blurLevel], 0, 0); ctx.restore();
    }

    function startDrawTouch(e) { e.preventDefault(); startDraw(e); }
    function drawTouch(e) { e.preventDefault(); draw(e); }
    function stopDraw() { if (drawing) { history.push(ctx.getImageData(0, 0, canvas.width, canvas.height)); if (history.length > 20) history.shift(); } drawing = false; axisLocked = null; }

    function draw(e) {
      if (!drawing || !originalImg) return; const { x, y } = getPos(e);
      const s = brushSize * (canvas.width / canvas.getBoundingClientRect().width);
      let dX = x, dY = y;
      if (shiftKey) { 
          if (!axisLocked) { 
              const dx = Math.abs(x - strokeStartX), dy = Math.abs(y - strokeStartY); 
              if (dx > 5 || dy > 5) axisLocked = dx > dy ? 'x' : 'y'; 
          } 
          if (axisLocked === 'x') dY = strokeStartY; else dX = strokeStartX; 
      }
      const dist = Math.hypot(dX - lastX, dY - lastY), steps = Math.max(1, Math.floor(dist / (s / 4))); 
      for (let i = 1; i <= steps; i++) {
          const cx = lastX + (dX - lastX) * (i/steps), cy = lastY + (dY - lastY) * (i/steps);
          ctx.save(); ctx.beginPath(); if (brushShape === 'circle') ctx.arc(cx, cy, s / 2, 0, Math.PI * 2); else ctx.rect(cx - s / 2, cy - s / 2, s, s);
          ctx.clip(); ctx.drawImage(blurCanvases[blurLevel], 0, 0); ctx.restore();
      }
      lastX = dX; lastY = dY;
    }

    function undo() { if (history.length > 1) { history.pop(); ctx.putImageData(history[history.length - 1], 0, 0); } }

    function saveToGallery() {
      if (!originalImg) return;
      savedImages.unshift({ __backendId: 'img-' + Date.now(), image_data: canvas.toDataURL('image/png') });
      localStorage.setItem('censored_images', JSON.stringify(savedImages));
      updateGallery(); showToast('¡Guardado!');
    }

    function closeCanvas() { document.getElementById('canvas-container').classList.add('hidden'); document.getElementById('upload-area').classList.remove('hidden'); document.getElementById('action-buttons').classList.add('hidden'); originalImg = null; activeImageId = null; renderLibrary(); updateGallery(); }

    function updateGallery() {
      const g = document.getElementById('gallery-preview'), s = document.getElementById('gallery-section');
      document.getElementById('image-count').textContent = savedImages.length;
      
      // Sutil contador de selección
      const selText = document.getElementById('selection-sub-text');
      selText.textContent = selectedImages.size > 0 ? `| ${selectedImages.size} seleccionadas` : '';

      if (savedImages.length === 0) { s.classList.add('hidden'); return; }
      s.classList.remove('hidden'); g.innerHTML = '';
      savedImages.forEach((img) => {
        const isActive = img.__backendId === activeImageId;
        const isSel = selectedImages.has(img.__backendId);
        const div = document.createElement('div');
        div.className = 'relative group shrink-0 w-20 h-20 transition-all duration-200';
        div.innerHTML = `
          <img src="${img.image_data}" onclick="editSavedImage('${img.__backendId}')" class="w-full h-full rounded object-cover border-2 cursor-pointer ${isActive ? 'img-active' : 'border-[#3a3a4a] group-hover:border-[#6c5ce7]'}">
          <label class="absolute top-1 left-1 bg-black/60 rounded p-0.5 z-10 cursor-pointer"><input type="checkbox" ${isSel ? 'checked' : ''} onchange="toggleSelect('${img.__backendId}')" class="hidden checkbox-custom"><div class="w-4 h-4 rounded border border-white/50 flex items-center justify-center"><i data-lucide="check" class="w-3 h-3 text-white opacity-0 transition-opacity"></i></div></label>
          <button onclick="deleteSavedImage('${img.__backendId}', event)" class="absolute top-1 right-1 bg-red-600 rounded p-1 opacity-0 group-hover:opacity-100 transition-opacity"><i data-lucide="x" class="w-3 h-3 text-white"></i></button>`;
        g.appendChild(div);
      });
      lucide.createIcons();
    }

    function toggleSelect(id) { selectedImages.has(id) ? selectedImages.delete(id) : selectedImages.add(id); updateGallery(); }
    
    function deleteSavedImage(id, event) {
        event.stopPropagation();
        savedImages = savedImages.filter(i => i.__backendId !== id);
        selectedImages.delete(id);
        if(activeImageId === id) { activeImageId = null; closeCanvas(); }
        localStorage.setItem('censored_images', JSON.stringify(savedImages));
        updateGallery();
    }

    function deleteAllSaved() { savedImages = []; selectedImages.clear(); activeImageId = null; closeCanvas(); localStorage.setItem('censored_images', JSON.stringify(savedImages)); updateGallery(); }
    function downloadDataUrl(dataUrl, filename) { const a = document.createElement('a'); a.href = dataUrl; a.download = filename; a.click(); }
    function downloadMainImage() { if (originalImg) downloadDataUrl(canvas.toDataURL('image/png'), 'Censura.png'); }

    async function createAndDownloadZip(imageArray, zipName) {
        const zip = new JSZip();
        imageArray.forEach((img, index) => zip.file(`Imagen_${index+1}.png`, img.image_data.split(',')[1], {base64: true}));
        const blob = await zip.generateAsync({type: "blob"});
        downloadDataUrl(URL.createObjectURL(blob), zipName);
    }

    function downloadSelectedAsZip() { if (selectedImages.size > 0) createAndDownloadZip(savedImages.filter(img => selectedImages.has(img.__backendId)), 'Seleccionadas.zip'); }
    function downloadAllAsZip() { if (savedImages.length > 0) createAndDownloadZip(savedImages, 'Galeria.zip'); }
    function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.style.opacity = '1'; setTimeout(() => t.style.opacity = '0', 2000); }

    lucide.createIcons();
  </script>
 </body>
</html>
